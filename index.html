<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRaromantics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#000;--card:#111113;--card2:#1a1a1d;--ink:#f5f5f7;--mut:#8e8e93;--acc:#1a7cf0;--line:#2a2a2e;--gold:#e0b25a;--bad:#ff6b63;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:#0d0d0f;text-align:center;font-size:.72rem;letter-spacing:.06em;font-weight:600;color:var(--mut);padding:8px 10px;text-transform:uppercase}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:40px;height:40px;border-radius:50%;background:#1a1a1d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand b{display:block;font-size:1.05rem}.brand small{color:var(--mut);font-weight:600;font-size:.72rem}
.search{flex:1 1 260px;max-width:460px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);outline:0}
.bag{background:var(--acc);border:0;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700}
.links{display:none;width:100%;gap:22px;justify-content:center;padding:6px 0}
.links.open{display:flex;flex-wrap:wrap}.links a{color:var(--ink);text-decoration:none;font-weight:500}
.hero{text-align:center;padding:70px 16px 40px;background:radial-gradient(ellipse 50% 40% at 50% 8%,rgba(255,150,60,.22),transparent 70%),radial-gradient(ellipse 40% 40% at 8% 25%,rgba(26,124,240,.2),transparent 70%)}
.hero h1{font-size:clamp(2.6rem,9vw,6rem);line-height:1.02;letter-spacing:-.04em;margin:0 auto;max-width:900px;font-weight:700}
.hero p{color:var(--mut);font-size:clamp(1rem,2.4vw,1.4rem);max-width:640px;margin:22px auto}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:999px;background:linear-gradient(#2b8cff,#0a68d8);color:#fff;padding:16px 28px;font-weight:600;font-size:1.05rem;text-decoration:none}
.btn.soft{background:var(--card2);color:#5aa8ff}
.btn.sm{padding:10px 16px;font-size:.88rem}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.dng{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.trust{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;color:var(--mut);margin:28px 0 36px;font-size:.95rem}
.sizer{max-width:680px;margin:0 auto;background:var(--card);border-radius:28px;padding:30px;display:flex;gap:28px;text-align:left;align-items:flex-start}
.bot{width:70px;flex:none}.bot i{display:block;height:16px;background:#555;border-radius:4px 4px 0 0;width:30px;margin:0 auto}
.bot div{height:200px;border:2px solid #666;border-radius:8px 8px 14px 14px;position:relative;overflow:hidden}
.bot em{position:absolute;left:0;right:0;bottom:0;background:var(--acc);transition:height .4s}
.sizer h3{font-size:2rem;margin:6px 0;letter-spacing:-.02em}.sizer small{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px;font-weight:500}
.chip.on{background:var(--ink);color:#000;border-color:var(--ink)}
.strip{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;margin:40px 0}
.strip div{display:inline-block;padding:22px 0;font-size:1.8rem;font-weight:600;animation:mq 30s linear infinite}
.strip span{margin:0 28px}.strip span:nth-child(even){color:var(--mut)}
@keyframes mq{to{transform:translateX(-50%)}}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.filters{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);padding:10px;border-radius:24px;margin-bottom:18px;align-items:center}
.filters input,.filters select{padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);outline:0}
.filters input{flex:1 1 280px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;display:flex;flex-direction:column}
.tags{display:flex;gap:10px;align-items:center;font-size:.72rem;font-weight:700}
.tag{border:1px solid #5a3a1a;color:#ff9a4d;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}
.pic{height:240px;display:flex;align-items:center;justify-content:center;font-size:5rem}.pic img{max-width:100%;max-height:100%;object-fit:contain}
.house{color:#3d96ff;font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;margin-top:8px}
.card h3{margin:4px 0 8px;font-size:1.4rem;letter-spacing:-.02em}
.notes{color:var(--mut);font-size:.88rem;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.sz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sz button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 2px;line-height:1.3;font-weight:600}
.sz button small{display:block;font-size:.6rem;color:var(--mut);text-transform:uppercase;font-weight:700}
.sz button.on{background:#3a2d12;border-color:var(--gold);color:var(--gold)}
.sz button[disabled]{opacity:.35;text-decoration:line-through;cursor:default}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1;text-align:center}
.surp{background:var(--card);border-radius:28px;padding:50px 30px;text-align:center;margin:60px 0}
.surp h2,.contact h2{font-size:2.4rem;letter-spacing:-.03em;margin:0 0 10px}.surp p,.contact p{color:var(--mut)}
.result{margin-top:20px;font-size:1.2rem}
.contact{text-align:center;padding:30px 0 50px}
footer{text-align:center;color:var(--mut);padding:24px;border-top:1px solid var(--line);font-size:.85rem}
.adm{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:#1a1408;border-bottom:1px solid var(--gold);padding:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet h2{margin:0 0 8px}.sheet label{display:block;font-size:.78rem;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem}
@media(max-width:560px){.sizer{flex-direction:column}.search{order:5;max-width:none}}
</style>
</head>

<div id="app"></div>
<script type="application/json" id="data">{"store":{"name":"MRaromantics","tagline":"Decants Auténticos & Muestras de Lujo","whatsapp":"524499829338"},"products":[{"id":"p1","name":"Spicebomb Night Vision","house":"Viktor&Rolf","type":"EDT","gender":"Unisex","notes":"Manzana verde, canela, ámbar y cuero.","p3":90,"p5":120,"p10":200,"pb":0,"img":""},{"id":"p2","name":"Le Beau Flower Edition","house":"Jean Paul Gaultier","type":"EDP","gender":"Unisex","notes":"Limón, bergamota, neroli, jazmín y coco.","p3":110,"p5":150,"p10":250,"pb":0,"img":""},{"id":"p3","name":"Spicebomb Infrared","house":"Viktor&Rolf","type":"EDP","gender":"Unisex","notes":"Pimienta rosa, chile, bergamota, canela y cuero.","p3":110,"p5":150,"p10":250,"pb":0,"img":""}]}</script>
<script>
(function(){
var state;try{state=JSON.parse(document.getElementById('data').textContent)}catch(e){state={store:{name:"Tienda",tagline:"",whatsapp:""},products:[]}}
var app=document.getElementById('app');
var SZ=[['p3','3 ml'],['p5','5 ml'],['p10','10 ml'],['pb','Botella']];
var q='',gen='Todas',house='',sort='new',hs='p3',menu=false,admin=false,dirty=false,modal=null,artifact=null,toastMsg='',sel={},bag=[],surprise=null;
var fmt=function(n){return '$'+Math.round(n).toLocaleString('es-MX')};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pr(p,k){return +p[k]>0?+p[k]:0}
function firstSize(p){for(var i=0;i<4;i++)if(pr(p,SZ[i][0]))return SZ[i][0];return null}
function cur(p){var s=sel[p.id];return s&&pr(p,s)?s:firstSize(p)}
function toast(m){toastMsg=m;render();setTimeout(function(){toastMsg='';render()},2500)}
function houses(){var s={};state.products.forEach(function(p){if(p.house)s[p.house]=1});return Object.keys(s).sort()}
function card(p){
 var c=cur(p);
 var sizes=SZ.map(function(z){var v=pr(p,z[0]);return '<button data-a="sz" data-id="'+p.id+'" data-k="'+z[0]+'"'+(v?'':' disabled')+(v&&c===z[0]?' class="on"':'')+'><small>'+(z[0]==='pb'?'BOTELLA':z[1])+'</small>'+(v?(c===z[0]&&z[0]!=='pb'?z[1].replace(' ','&nbsp;')+'<br>':'')+fmt(v):'N/D')+'</button>'}).join('');
 var acts=admin?'<div class="acts"><button class="btn sm ghost" data-a="edit" data-id="'+p.id+'">Editar</button><button class="btn sm dng" data-a="del" data-id="'+p.id+'">Borrar</button></div>':'<div class="acts"><button class="btn sm"'+(c?'':' disabled')+' data-a="add" data-id="'+p.id+'">'+(c?'Agregar a la bolsa':'Agotado')+'</button></div>';
 return '<article class="card"><div class="tags"><span>'+esc(p.type)+'</span><span class="tag">'+esc(p.gender)+'</span></div><div class="pic">'+(p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">':'🧴')+'</div><div class="house">'+esc(p.house)+'</div><h3>'+esc(p.name)+'</h3><p class="notes">Notas: '+esc(p.notes)+'</p><div class="sz">'+sizes+'</div>'+acts+'</article>';
}
function modalHtml(){
 if(!modal)return'';
 if(modal.t==='store'){var s=state.store;return '<div class="modal"><div class="sheet"><h2>Datos de la tienda</h2><label>Nombre</label><input id="f-n" value="'+esc(s.name)+'"><label>Subtítulo</label><input id="f-t" value="'+esc(s.tagline)+'"><label>WhatsApp (con lada, ej. 522431066247)</label><input id="f-w" value="'+esc(s.whatsapp)+'" inputmode="numeric"><div class="mact"><button class="btn sm ghost" data-a="close">Cancelar</button><button class="btn sm" data-a="savestore">Guardar</button></div></div></div>'}
 if(modal.t==='bag'){
  var tot=0;var rows=bag.map(function(b,i){var p=state.products.find(function(x){return x.id===b.id});if(!p)return'';var v=pr(p,b.k);tot+=v;return '<div class="line"><span>'+esc(p.name)+' · '+SZ.find(function(z){return z[0]===b.k})[1]+'</span><span>'+fmt(v)+' <button class="pill" style="padding:2px 9px" data-a="rm" data-id="'+i+'">×</button></span></div>'}).join('');
  var msg='Hola, quiero pedir:\n'+bag.map(function(b){var p=state.products.find(function(x){return x.id===b.id});return p?'• '+p.name+' ('+SZ.find(function(z){return z[0]===b.k})[1]+') '+fmt(pr(p,b.k)):''}).join('\n')+'\nTotal: '+fmt(tot);
  return '<div class="modal"><div class="sheet"><h2>Tu bolsa</h2>'+(rows||'<p style="color:var(--mut)">Está vacía.</p>')+(rows?'<div class="line"><b>Total</b><b>'+fmt(tot)+'</b></div>':'')+'<div class="mact"><button class="btn sm ghost" data-a="close">Cerrar</button>'+(rows?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(state.store.whatsapp.replace(/\D/g,''))+'?text='+encodeURIComponent(msg)+'">Pedir por WhatsApp</a>':'')+'</div></div></div>'}
 var p=modal.p;
 return '<div class="modal"><div class="sheet"><h2>'+(modal.isNew?'Nuevo perfume':'Editar perfume')+'</h2><label>Nombre</label><input id="f-name" value="'+esc(p.name)+'"><div class="two"><div><label>Casa / marca</label><input id="f-house" value="'+esc(p.house)+'"></div><div><label>Concentración</label><select id="f-type">'+['EDP','EDT','Parfum','Extrait','EDC'].map(function(o){return'<option'+(o===p.type?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div></div><label>Género</label><select id="f-gen">'+['Unisex','Masculino','Femenino'].map(function(o){return'<option'+(o===p.gender?' selected':'')+'>'+o+'</option>'}).join('')+'</select><label>Notas</label><textarea id="f-notes" rows="3">'+esc(p.notes)+'</textarea><label>Precios en MXN (vacío o 0 = N/D, agotado)</label><div class="two">'+SZ.map(function(z){return'<div><label>'+z[1]+'</label><input id="f-'+z[0]+'" type="number" min="0" value="'+(pr(p,z[0])||'')+'"></div>'}).join('')+'</div><label>Foto</label><input id="f-img" type="file" accept="image/*">'+(p.img?'<img src="'+esc(p.img)+'" alt="" style="width:80px;margin-top:6px;border-radius:8px">':'')+'<div class="mact"><button class="btn sm ghost" data-a="close">Cancelar</button><button class="btn sm" data-a="save">Guardar</button></div></div></div>';
}
function render(){
 var keep=document.activeElement,kid=keep&&keep.id,pos=keep&&keep.selectionStart;
 var list=state.products.filter(function(p){return(gen==='Todas'||p.gender===gen)&&(!house||p.house===house)&&(!q||(p.name+' '+p.house+' '+p.notes).toLowerCase().indexOf(q.toLowerCase())>-1)});
 if(sort==='lo')list.sort(function(a,b){return(pr(a,firstSize(a))||1e9)-(pr(b,firstSize(b))||1e9)});
 else if(sort==='az')list.sort(function(a,b){return a.name.localeCompare(b.name)});
 else list=list.slice().reverse();
 var vals=state.products.map(function(p){return pr(p,hs)}).filter(Boolean),min=vals.length?Math.min.apply(null,vals):0;
 var fill={p3:25,p5:40,p10:65,pb:100}[hs];
 var S=state.store,wa=S.whatsapp.replace(/\D/g,''),ph=wa.length>10?'+'+wa.slice(0,2)+' '+wa.slice(2,5)+' '+wa.slice(5,8)+' '+wa.slice(8):wa;
 var ticker=['Entregas en tu zona','Decants auténticos','Envíos a toda la república','Decants sellados','3, 5 y 10 ml'].map(function(t){return'<span>✦ '+t+'</span>'}).join('');
 app.innerHTML=(admin?'<div class="adm"><b>Modo edición</b><button class="btn sm ghost" data-a="new">+ Perfume</button><button class="btn sm ghost" data-a="store">Tienda</button><button class="btn sm" data-a="pub"'+(dirty?'':' disabled')+'>Publicar cambios</button></div>':'')
 +'<div class="top">'+esc(S.name)+' • Muestras de lujo • Decants auténticos • Envíos express</div>'
 +'<header class="nav"><button class="pill" data-a="menu">☰ Menú</button><div class="brand"><div class="logo">✦</div><div><b>'+esc(S.name)+'</b><small>'+esc(S.tagline)+'</small></div></div><input id="q" class="search" type="search" placeholder="Buscar fragancia, casa o notas..." value="'+esc(q)+'"><button class="bag" data-a="bag">Bolsa ('+bag.length+')</button><nav class="links'+(menu?' open':'')+'"><a href="#catalogo">Catálogo</a><a href="#sorpresa">Sorpresa</a><a href="#contacto">Contacto</a></nav></header>'
 +'<section class="hero"><h1>Tu muestra de lujo al mejor precio.</h1><p>Decants sellados de 3, 5 y 10 ml o botella completa. 100% originales, con envíos a toda la república.</p><div class="cta"><a class="btn" href="#catalogo">Ver catálogo</a>'+(wa?'<a class="btn soft" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">'+esc(ph)+'</a>':'')+'</div><div class="trust"><span>🛡 100% originales</span><span>🚚 Envíos a toda la república</span><span>💧 Decants sellados</span><span>💬 Atención por WhatsApp</span></div>'
 +'<div class="sizer"><div class="bot"><i></i><div><em style="height:'+fill+'%"></em></div></div><div><div class="chips">'+SZ.map(function(z){return'<button class="chip'+(z[0]===hs?' on':'')+'" data-a="hs" data-k="'+z[0]+'">'+z[1]+'</button>'}).join('')+'</div><p style="margin:16px 0 0;font-weight:600">Para probar sin compromiso</p><h3>'+(min?'Desde '+fmt(min)+' MXN':'Consulta precio')+'</h3><small>'+state.products.length+' fragancias en el catálogo</small></div></div></section>'
 +'<div class="strip"><div>'+ticker+ticker+ticker+ticker+'</div></div>'
 +'<main class="wrap" id="catalogo"><div class="filters"><input id="q2" type="search" placeholder="Buscar perfume, marca o notas..." value="'+esc(q)+'"><select id="sort"><option value="new"'+(sort==='new'?' selected':'')+'>Más recientes</option><option value="lo"'+(sort==='lo'?' selected':'')+'>Menor precio</option><option value="az"'+(sort==='az'?' selected':'')+'>A–Z</option></select><select id="house"><option value="">Todas las Casas</option>'+houses().map(function(h){return'<option'+(h===house?' selected':'')+'>'+esc(h)+'</option>'}).join('')+'</select></div><div class="chips">'+['Todas','Unisex','Masculino','Femenino'].map(function(g){return'<button class="chip'+(g===gen?' on':'')+'" data-a="gen" data-k="'+g+'">'+g+'</button>'}).join('')+'</div>'
 +(list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<p style="text-align:center;color:var(--mut);padding:40px">No hay perfumes para mostrar.</p>')
 +'<section class="surp" id="sorpresa"><h2>¿No sabes cuál elegir?</h2><p>Te sacamos una fragancia al azar, siempre con alguna opción disponible.</p><button class="btn" data-a="surp">Sugerir un perfume</button>'+(surprise?'<div class="result">✨ <b>'+esc(surprise.name)+'</b> — '+esc(surprise.house)+'<br><small style="color:var(--mut)">Desde '+fmt(pr(surprise,firstSize(surprise)))+'</small></div>':'')+'</section>'
 +'<section class="contact" id="contacto"><h2>Contacto</h2><p>Atención directa por WhatsApp y entregas personales.</p>'+(wa?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">Escríbenos '+esc(ph)+'</a>':'')+'</section></main><footer>© '+esc(S.name)+'</footer>'+modalHtml()+(toastMsg?'<div class="toast">'+esc(toastMsg)+'</div>':'');
 if(kid&&document.getElementById(kid)&&/^(q|q2)$/.test(kid)){var n=document.getElementById(kid);n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
}
function buildDoc(){var c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');return'<!DOCTYPE html>\n'+c.outerHTML}
function readImg(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,640/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*s);cv.height=Math.round(i.height*s);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);res(cv.toDataURL('image/webp',.8))};i.src=r.result};r.readAsDataURL(f)})}
function v(id){return document.getElementById(id).value}
app.addEventListener('input',function(e){var t=e.target;if(t.id==='q'||t.id==='q2'){q=t.value;render()}});
app.addEventListener('change',function(e){var t=e.target;if(t.id==='sort'){sort=t.value;render()}else if(t.id==='house'){house=t.value;render()}});
app.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
 if(a==='menu'){menu=!menu;render()}
 else if(a==='hs'){hs=k;render()}
 else if(a==='gen'){gen=k;render()}
 else if(a==='sz'){sel[id]=k;render()}
 else if(a==='add'){var p=state.products.find(function(x){return x.id===id});bag.push({id:id,k:cur(p)});toast('Agregado a la bolsa')}
 else if(a==='bag'){modal={t:'bag'};render()}
 else if(a==='rm'){bag.splice(+id,1);render()}
 else if(a==='surp'){var av=state.products.filter(firstSize);surprise=av.length?av[Math.floor(Math.random()*av.length)]:null;render()}
 else if(a==='new'){modal={isNew:true,p:{id:'p'+Date.now(),name:'',house:'',type:'EDP',gender:'Unisex',notes:'',p3:0,p5:0,p10:0,pb:0,img:''}};render()}
 else if(a==='edit'){modal={isNew:false,p:Object.assign({},state.products.find(function(x){return x.id===id}))};render()}
 else if(a==='del'){if(confirm('¿Borrar este perfume?')){state.products=state.products.filter(function(x){return x.id!==id});dirty=true;render()}}
 else if(a==='close'){modal=null;render()}
 else if(a==='store'){modal={t:'store'};render()}
 else if(a==='savestore'){state.store={name:v('f-n'),tagline:v('f-t'),whatsapp:v('f-w')};modal=null;dirty=true;render()}
 else if(a==='save'){
  var p=modal.p;p.name=v('f-name').trim()||'Sin nombre';p.house=v('f-house');p.type=v('f-type');p.gender=v('f-gen');p.notes=v('f-notes');
  SZ.forEach(function(z){p[z[0]]=+v('f-'+z[0])||0});
  var f=document.getElementById('f-img').files[0];
  var done=function(){var i=state.products.findIndex(function(x){return x.id===p.id});if(i>-1)state.products[i]=p;else state.products.push(p);modal=null;dirty=true;render()};
  if(f)readImg(f).then(function(d){p.img=d;done()});else done();
 }
 else if(a==='pub'){
  if(!artifact||!dirty)return;b.disabled=true;b.textContent='Publicando…';
  artifact.publish(buildDoc()).then(function(){dirty=false}).catch(function(er){toast('No se pudo publicar'+(er&&er.code?' ('+er.code+')':''))});
 }
});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
render();
if(window.claude&&claude.use){
 Promise.all([claude.use('artifact'),claude.use('user')]).then(function(r){
  artifact=r[0];var u=r[1];try{admin=!!(artifact&&u&&u.canEdit())}catch(e){admin=false}
  if(admin)render();
 }).catch(function(){});
}
})();
</script>
</body>
